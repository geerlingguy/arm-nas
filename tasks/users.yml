---
- name: Create groups for shared accounts.
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  with_items:
    - "nas-sharers"
    - "zowiebox"

- name: Make sure Ansible user is in shared groups.
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: "nas-sharers,zowiebox"
    append: true

- name: Create extra users on HL15.
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups }}"
    append: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  run_once: true
  delegate_to: nas01.mmoffice.net
  with_items:
    - name: zowiebox
      groups: ['zowiebox']
    - name: jpgeerling
      groups: ['nas-sharers']
